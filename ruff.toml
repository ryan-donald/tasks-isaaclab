line-length = 88
target-version = "py312"

[lint]
select = ["E", "F", "I", "W"]
ignore = []

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"

[lint.isort]
known-first-party = ["ryan_tasks"]
known-third-party = ["wandb", "gymnasium", "isaaclab_tasks", "torch", "numpy"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ryan_tasks"
version = "0.2.0"
description = "Isaac Lab tasks for the SO-ARM101 robot arm."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Ryan Donald" }]
requires-python = ">=3.12"
dependencies = ["isaaclab", "isaaclab_tasks", "isaaclab_rl"]

# registers the tasks with Isaac Lab tools that load external task packages.
[project.entry-points."isaaclab.tasks"]
ryan_tasks = "ryan_tasks.tasks"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ryan_tasks = ["**/*.urdf", "**/*.stl", "**/*.part", "**/*.npz", "**/*.pt", "**/*.usda", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
